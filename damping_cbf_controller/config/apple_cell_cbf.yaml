# ==============================================================================
# UR10e Apple Picking Cell — Damping CBF Controller Configuration
# ==============================================================================

# Simulation & Execution Timing
simulation:
  dt: 0.001          # Simulation time step [s] (1 kHz)
  period: 4.5        # Base duration of one 3D harmonic cycle [s]
  num_periods: 2     # Number of consecutive periods before simulation ends
  tool_frame: "ur10e_tool0"

# File Paths (relative to package root or absolute)
paths:
  xacro_file: "/home/galileo/projects/apple_cell_ws/src/apple_cell/apple_picking_cell_description/urdf/apple_picking_cell.urdf.xacro"
  csv_output: "examples/csv/sim_apple_cell_trajectory.csv"
  plot_output: "examples/plots/fig5_apple_cell_pinocchio.png"

# Hyperplanes defining the safety obstacles
planes:
  plane1:
    name: "Table Sorting Surface"
    normal: [0.0, 0.0, 1.0]
    offset: [0.48, 0.16, 1.05]
  plane2:
    name: "45° Wall"
    normal: [-0.7071067811865475, 0.0, 0.7071067811865475]
    offset: [0.55, 0.16, 1.05]

# Control Barrier Function (CBF) Parameters
cbf:
  p_ths: 0.35                       # Braking zone thickness / boundary threshold [m]
  v_ths: -0.003                     # Safe touchdown normal velocity [m/s]
  v_0: -0.4                         # Safe entry boundary normal velocity [m/s]
  gamma: 20.0                        # CBF convergence gain [s^-1]
  d_max: 50.0                       # Maximum synthesized variable damping [Ns/m]
  profile: "smoothstep"             # Envelope profile: "smoothstep", "quadratic", or "linear"
  compensate_external_force: true   # Whether to include external wrench F_ext in a_drift (if false, only nominal impedance forces are included in a_drift)

# Cartesian Impedance Gains (Compliance Law)
impedance:
  K_pos: [450.0, 450.0, 450.0]      # Translational stiffness [N/m]
  K_rot: [60.0, 60.0, 60.0]         # Rotational stiffness [Nm/rad]
  D_pos: [55.0, 55.0, 55.0]         # Translational damping [Ns/m]
  D_rot: [10.0, 10.0, 10.0]         # Rotational damping [Nms/rad]

# Nullspace Posture Regulation
nullspace:
  K_posture: [25.0, 25.0, 25.0, 25.0, 25.0, 25.0]  # Posture stiffness [Nm/rad]
  D_posture: [6.0, 6.0, 6.0, 6.0, 6.0, 6.0]        # Posture damping [Nms/rad]
  q_init: [1.57, -1.8, 1.8, -1.57, -1.57, 0.0]     # Initial joint seed for IK

# Desired Harmonic Trajectory Parameters
trajectory:
  x:
    center: 0.48
    amp_cos1: 0.09
    amp_cos2: -0.03
  y:
    center: 0.15
    amp_sin1: 0.17
  z:
    center: 1.18
    amp_cos1: -0.125
    amp_cos2: 0.02
